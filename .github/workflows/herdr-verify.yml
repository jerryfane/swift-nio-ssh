# Verification only, NOT part of the tagged fix: runs the window-adjust regression test on
# Linux. herdr/verify-fixed = the fix commit; herdr/verify-unfixed = a05e6bbe + the test only,
# where the test is expected to die on the preconditionFailure.
name: herdr-verify
on:
  push:
    branches: ["herdr/verify-*"]
jobs:
  test:
    runs-on: ubuntu-latest
    container: swift:6.1
    steps:
      - uses: actions/checkout@v4
      - name: Build tests
        run: swift build --build-tests --enable-test-discovery
      - name: Regression test
        shell: bash
        run: |
          set -o pipefail
          test=NIOSSHTests.ChildChannelMultiplexerTests/testWeDontResizeTheWindowForReadsDeliveredAfterLocalClose
          if [ "$GITHUB_REF_NAME" = herdr/verify-unfixed ]; then
            if swift test --skip-build --enable-test-discovery --filter "$test" 2>&1 | tee test.log; then
              echo "::error::expected the unfixed tree to crash"; exit 1
            fi
            grep -F "Sent channel window adjust on channel in invalid state" test.log
          else
            swift test --skip-build --enable-test-discovery --filter "$test"
          fi
      - name: Full suite
        if: github.ref_name == 'herdr/verify-fixed'
        run: swift test --skip-build --enable-test-discovery
